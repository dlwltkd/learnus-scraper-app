name: Deploy to Droplet

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        env:
          TESTING: '1'
        run: pytest tests/ -v --tb=short

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version-file: learnus-app/.nvmrc
          cache: npm
          cache-dependency-path: learnus-app/package-lock.json

      - name: Build web client
        working-directory: learnus-app
        env:
          EXPO_NO_TELEMETRY: '1'
        run: |
          npm ci
          npx tsc --noEmit
          npx expo export --platform web
          test -s dist/index.html
          grep -R -I -q '/api' dist/_expo/static/js
          ! grep -R -I -q 'api.dlwltkd.com' dist/_expo/static/js
          npm audit --omit=dev --audit-level=critical

      - name: Test browser helper
        working-directory: browser-extension
        run: |
          npm test
          npm run build:production

      - name: Upload web client
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: learnus-app/dist
          if-no-files-found: error
          retention-days: 7

  deploy-api:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Download web client
        uses: actions/download-artifact@v4
        with:
          name: web-dist
          path: web-dist

      - name: Stage web client on Droplet
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          source: 'web-dist/*'
          target: '/tmp/learnus-web-${{ github.sha }}'
          strip_components: 1
          rm: true

      - name: Deploy API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            # Without this, a failed `git pull` is followed by a successful rebuild of
            # the code already on disk, and the job reports success while having shipped
            # nothing. That happened: a stray local edit blocked the pull for two days
            # and every deploy in between was a silent no-op.
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            # Prove the checkout is actually the commit that triggered this run.
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"

            web_release="/tmp/learnus-web-${{ github.sha }}"
            test -s "$web_release/index.html"
            # Keep old content-addressed assets for tabs left open across a release.
            if [ -d web-dist/_expo/static ]; then
              mkdir -p "$web_release/_expo/static"
              cp -a web-dist/_expo/static/. "$web_release/_expo/static/"
            fi
            if [ -d web-dist/assets ]; then
              mkdir -p "$web_release/assets"
              cp -a web-dist/assets/. "$web_release/assets/"
            fi
            rm -rf web-dist.previous
            if [ -d web-dist ]; then
              mv web-dist web-dist.previous
            fi

            rollback_web() {
              rm -rf web-dist
              if [ -d web-dist.previous ]; then
                mv web-dist.previous web-dist
              fi
              docker compose up -d --force-recreate caddy || true
            }
            trap rollback_web ERR
            mv "$web_release" web-dist
            docker compose up -d --no-deps --build api
            docker compose up -d --force-recreate caddy
            docker compose exec -T caddy caddy validate --config /etc/caddy/Caddyfile
            api_ready=false
            for attempt in $(seq 1 30); do
              if curl --fail --silent http://127.0.0.1:8000/version >/dev/null; then
                api_ready=true
                break
              fi
              sleep 1
            done
            test "$api_ready" = true
            trap - ERR
            rm -rf web-dist.previous

  deploy-worker:
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            worker:
              - 'worker.py'
              - 'scheduler.py'
              - 'ai_service.py'
              - 'moodle_client.py'
              - 'database.py'
              - 'requirements.txt'
              - 'Dockerfile'

      - name: Rebuild worker
        if: steps.changes.outputs.worker == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            # The pull happened in deploy-api, which this job depends on.
            docker compose rm -sf worker || true
            docker rm -f learnus_worker || true
            docker compose up -d --no-deps --build --force-recreate worker
