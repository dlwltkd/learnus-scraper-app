name: Deploy to Droplet

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements-test.txt

      - name: Run tests
        env:
          TESTING: '1'
        run: pytest tests/ -v --tb=short

  deploy-api:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Deploy API
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            # Without this, a failed `git pull` is followed by a successful rebuild of
            # the code already on disk, and the job reports success while having shipped
            # nothing. That happened: a stray local edit blocked the pull for two days
            # and every deploy in between was a silent no-op.
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            git pull origin main
            # Prove the checkout is actually the commit that triggered this run.
            test "$(git rev-parse HEAD)" = "${{ github.sha }}"
            docker compose up -d --no-deps --build api
            docker compose up -d caddy

  deploy-worker:
    runs-on: ubuntu-latest
    needs: deploy-api
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            worker:
              - 'worker.py'
              - 'scheduler.py'
              - 'ai_service.py'
              - 'moodle_client.py'
              - 'database.py'
              - 'requirements.txt'
              - 'Dockerfile'

      - name: Rebuild worker
        if: steps.changes.outputs.worker == 'true'
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DROPLET_HOST }}
          username: ${{ secrets.DROPLET_USER }}
          key: ${{ secrets.DROPLET_SSH_KEY }}
          script: |
            set -euo pipefail
            cd ${{ secrets.DEPLOY_PATH }}
            # The pull happened in deploy-api, which this job depends on.
            docker compose rm -sf worker || true
            docker rm -f learnus_worker || true
            docker compose up -d --no-deps --build --force-recreate worker
