services:
  caddy:
    image: caddy:2
    container_name: learnus_caddy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - ./web-dist:/srv:ro
      - caddy_data:/data
    depends_on:
      - api
    restart: always

  api:
    build: .
    container_name: learnus_api
    ports:
      - "127.0.0.1:8000:8000"
    expose:
      - "8000"
    environment:
      - DATABASE_URL=postgresql://user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/learnus
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - DAILY_CHAT_LIMIT=${DAILY_CHAT_LIMIT:-30}
      - DAILY_TRANSCRIBE_LIMIT=${DAILY_TRANSCRIBE_LIMIT:-3}
      - DAILY_SERVICE_CHAT_LIMIT=${DAILY_SERVICE_CHAT_LIMIT:-1000}
      - DAILY_SERVICE_TRANSCRIBE_LIMIT=${DAILY_SERVICE_TRANSCRIBE_LIMIT:-100}
      - DAILY_TRANSCRIBE_SECONDS_LIMIT=${DAILY_TRANSCRIBE_SECONDS_LIMIT:-21600}
      - MAX_QUEUED_TRANSCRIPTIONS_PER_USER=${MAX_QUEUED_TRANSCRIPTIONS_PER_USER:-3}
      - TRANSCRIBE_BYPASS_USERS=${TRANSCRIBE_BYPASS_USERS:-}
      - TRANSCRIBE_BYPASS_TOKENS=${TRANSCRIBE_BYPASS_TOKENS:-}
      - LABS_ALLOWED_USERS=${LABS_ALLOWED_USERS:-}
      - API_TOKEN_TTL_DAYS=${API_TOKEN_TTL_DAYS:-30}
      - RATE_LIMIT_STORAGE_URI=redis://redis:6379/0
      - IP_RATE_LIMIT=${IP_RATE_LIMIT:-120/minute}
      - WEB_ALLOWED_ORIGINS=${WEB_ALLOWED_ORIGINS:-https://luconnect.dlwltkd.com}
      - WEB_LOGIN_TICKET_TTL_SECONDS=${WEB_LOGIN_TICKET_TTL_SECONDS:-90}
      - WEB_SESSION_TTL_DAYS=${WEB_SESSION_TTL_DAYS:-7}
      - WEB_SESSION_COOKIE_NAME=${WEB_SESSION_COOKIE_NAME:-__Host-luconnect_session}
      - WEB_SESSION_COOKIE_SECURE=${WEB_SESSION_COOKIE_SECURE:-true}
      # Port 8000 is loopback-only, so forwarded headers can only arrive through
      # containers on this private Compose network (normally Caddy).
      - FORWARDED_ALLOW_IPS=*
    depends_on:
      - db
      - redis
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 1g
    pids_limit: 256
    volumes:
      # Downloaded course material. Must be a volume: without it every rebuild wipes
      # the corpus and it can only be refetched with a live LearnUs session.
      - course_files:/app/course_files

  worker:
    build: .
    container_name: learnus_worker
    command: python worker.py
    environment:
      - DATABASE_URL=postgresql://user:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@db:5432/learnus
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - WORKER_MAX_CONCURRENCY=${WORKER_MAX_CONCURRENCY:-4}
      - DAILY_TRANSCRIBE_LIMIT=${DAILY_TRANSCRIBE_LIMIT:-3}
      - DAILY_CHAT_LIMIT=${DAILY_CHAT_LIMIT:-30}
      - DAILY_SERVICE_CHAT_LIMIT=${DAILY_SERVICE_CHAT_LIMIT:-1000}
      - DAILY_SERVICE_TRANSCRIBE_LIMIT=${DAILY_SERVICE_TRANSCRIBE_LIMIT:-100}
      - DAILY_TRANSCRIBE_SECONDS_LIMIT=${DAILY_TRANSCRIBE_SECONDS_LIMIT:-21600}
      - TRANSCRIBE_BYPASS_USERS=${TRANSCRIBE_BYPASS_USERS:-}
      - TRANSCRIBE_BYPASS_TOKENS=${TRANSCRIBE_BYPASS_TOKENS:-}
      - TRANSCRIBE_TIMING_LOG_ENABLED=${TRANSCRIBE_TIMING_LOG_ENABLED:-true}
      - TRANSCRIBE_TIMING_LOG_PATH=${TRANSCRIBE_TIMING_LOG_PATH:-/app/error_log/transcribe_timing.jsonl}
      - LABS_ALLOWED_USERS=${LABS_ALLOWED_USERS:-}
      - MAX_MEDIA_DURATION_SECONDS=${MAX_MEDIA_DURATION_SECONDS:-14400}
      - FFMPEG_WALL_TIMEOUT_SECONDS=${FFMPEG_WALL_TIMEOUT_SECONDS:-1800}
      - FFMPEG_NETWORK_TIMEOUT_US=${FFMPEG_NETWORK_TIMEOUT_US:-30000000}
    depends_on:
      - db
      - redis
    restart: always
    read_only: true
    tmpfs:
      - /tmp:size=1g,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 2g
    pids_limit: 256
    volumes:
      - ./error_log:/app/error_log
      - course_files:/app/course_files
    stop_grace_period: 10m  # give worker up to 10min to finish a transcription before force-kill

  db:
    image: postgres:15
    container_name: learnus_db
    ports:
      - "127.0.0.1:5432:5432"
    environment:
      - POSTGRES_USER=user
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      - POSTGRES_DB=learnus
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes
    restart: always
    volumes:
      - redis_data:/data
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 256m
    pids_limit: 128

volumes:
  postgres_data:
  caddy_data:
  course_files:
  redis_data:
